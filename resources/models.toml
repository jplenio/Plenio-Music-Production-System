# Catalogue of the ComfyUI-format model files the Plenio templates load (schema plenio.models/1).
#
# One source of truth: tools/build_graphs.py writes the loaders' download entries
# (properties.models) from it, the System Check lists what is installed, and the model guide
# (docs/user/models.md) follows it. The files themselves are downloaded by ComfyUI (missing-model
# dialog) or by hand - Plenio never downloads them.
#
#   default             a template's loader is set to this file (false: an alternative that the
#                       System Check may recommend; choose it in the loader)
#   templates           templates that need the file to run
#   optional_templates  templates in which only an optional (bypassed) block uses it
#   bytes               file size where a public listing gave it (legacy toolkit models_config.json,
#                       checked against the Hugging Face tree API on 2026-09-14); 0 = not recorded

schema = "plenio.models/1"

