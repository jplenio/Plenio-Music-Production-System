# Every video of Plenio, by a key that never changes (schema plenio.media/1, MP section 6).
#
# README, docs, posts and the descriptions of other videos link a key's go-link,
# https://jplenio.github.io/Plenio-Music-Production-System/go/<key>/ - never YouTube directly. A video uploaded
# anew changes one line here; `python tools/media_links.py --write` then writes the go pages (docs/go/) and the
# player's list (frontend/src/player/media.generated.ts). An old upload is set to unlisted, never deleted: an
# installed player of an older version keeps playing its id.

schema = "plenio.media/1"
site = "https://jplenio.github.io/Plenio-Music-Production-System"

