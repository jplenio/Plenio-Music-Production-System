name: Release

# A tag v<version> publishes (MP 8.2): the whole CI first, then the GitHub release with the committed notes
# (docs/releases/<version>.md) and the release files, the Comfy Registry, and a check that the published package
# installs into a fresh ComfyUI with everything it should register. `tools/release.py prepare` made the commit the
# tag points at; tagging and pushing are the owner's. Needs the secret REGISTRY_ACCESS_TOKEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      browser: true

  # the DAW plug-in: the Windows installer and zip, the macOS package (experimental - the release goes on without it)
  vst3:
    uses: ./.github/workflows/vst3.yml
    with:
      package: true

  release:
    needs: [checks, vst3]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install comfy-cli
      - run: git config --global core.quotePath false
      - name: The tag is the version, and the tree is as prepared
        run: |
          test "v$(python tools/release.py version)" = "${GITHUB_REF_NAME}"
          python tools/release.py verify
      - run: python tools/build_release_assets.py --out dist
      - uses: actions/download-artifact@v5
        with:
          pattern: plenio-vst3-*
          path: dist/vst3-artifacts
      - name: Plenio VST3's installers beside the release files, with their checksums
        run: |
          mkdir -p dist/vst3
          find dist/vst3-artifacts -type f \( -name 'Plenio-VST3-*' \) -exec cp {} dist/vst3/ \;
          rm -rf dist/vst3-artifacts
          ls dist/vst3/Plenio-VST3-*-windows-x64-setup.exe dist/vst3/Plenio-VST3-*-windows-x64.zip
          (cd dist/vst3 && sha256sum Plenio-VST3-* > Plenio-VST3-SHA256SUMS.txt)
      - name: The GitHub release with the committed notes
        env:
          GH_TOKEN: ${{ github.token }}
        # a re-run after a failed Registry step finds the release made: it adds the files again instead of failing
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*/* --title "Plenio ${GITHUB_REF_NAME#v}" --notes-file "docs/releases/${GITHUB_REF_NAME#v}.md" --verify-tag
          fi
      - name: Publish to the Comfy Registry
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

  verify-published:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: plenio
      - uses: actions/checkout@v5
        with:
          repository: Comfy-Org/ComfyUI
          ref: v0.44.2
          path: ComfyUI
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ComfyUI/requirements.txt comfy-cli
      - name: The published package in a fresh ComfyUI
        working-directory: plenio
        # the Registry may take some minutes to serve a new version; a flagged one may not be served at all - then
        # this job is red after a publish that cannot be undone, and registry_status.py says why
        run: |
          for attempt in 1 2 3 4 5 6; do
            python tools/verify_install.py --comfyui ../ComfyUI --version "${GITHUB_REF_NAME#v}" && exit 0
            sleep 120
          done
          python tools/registry_status.py --version "${GITHUB_REF_NAME#v}"
          exit 1
